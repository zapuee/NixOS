profiles_dir = "$THEME_MANAGER_DATA_DIR/profiles"
state_file = "$XDG_STATE_HOME/theme-manager/state.toml"
generated_dir = "$XDG_CONFIG_HOME/theme-manager/generated"
default_theme = "glass"

[color_providers.static]
kind = "static"

[color_palettes.fallback]
provider = "static"
source = "static"

[color_palettes.fallback.colors]
background = "#0f1512"
on_background = "#dfe4de"
surface = "#0f1512"
on_surface = "#dfe4de"
primary = "#80d998"
on_primary = "#00210b"
secondary = "#9ccaff"
on_secondary = "#001d33"
error = "#ffb4ab"
on_error = "#690005"
outline = "#7c9598"
shadow = "#000000"

[theme_bundles.glass]
structure = "glass"
palette = "fallback"

[theme_bundles.paper]
structure = "paper"
palette = "fallback"

[application_contracts.niri]
required = ["gaps", "focus_ring", "shadow", "corner_radius"]

[application_contracts.foot]
required = ["background_alpha"]
optional = ["window_structure"]

[application_wires.niri]
adapter = "niri"
global_role = "compositor"

[[application_wires.niri.windows]]
application = "foot"
role = "terminal"
app_id = "^(foot|footclient)$"
opacity_owner = "application"

[application_wires.foot-alpha]
adapter = "foot"
role = "terminal"
